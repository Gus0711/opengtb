# Exemples downlink pour MClimate Vicki (consommés par opengtb comme chips
# pré-remplissables dans l'éditeur d'encodage). Les keys sont en camelCase
# car l'encoder fait `switch (key)` sur les Object.keys du payload.
examples:
  - description: Recalibrer le moteur
    input:
      data:
        recalibrateMotor: true
    output:
      bytes: [3]
      fPort: 1
  - description: Forcer la fermeture
    input:
      data:
        forceClose: true
    output:
      bytes: [11]
      fPort: 1
  - description: Reboot du device
    input:
      data:
        deviceReset: true
    output:
      bytes: [48]
      fPort: 1
  - description: Consigne 21 °C
    input:
      data:
        setTargetTemperature: 21
    output:
      bytes: [14, 21]
      fPort: 1
  - description: Activer le verrou enfant
    input:
      data:
        setChildLock: true
    output:
      bytes: [7, 1]
      fPort: 1
  - description: Désactiver le verrou enfant
    input:
      data:
        setChildLock: false
    output:
      bytes: [7, 0]
      fPort: 1
  - description: Période d'envoi 30 minutes
    input:
      data:
        setKeepAlive: 30
    output:
      bytes: [2, 30]
      fPort: 1
  - description: Plage température 15–21 °C
    input:
      data:
        setTemperatureRange:
          min: 15
          max: 21
    output:
      bytes: [8, 15, 21]
      fPort: 1
  - description: Ouverture valve à 50 %
    input:
      data:
        setValveOpenness: 50
    output:
      bytes: [78, 50]
      fPort: 1
  - description: Détection fenêtre ouverte (Δ=3 °C, fermeture 20 s)
    input:
      data:
        setOpenWindow:
          enabled: true
          closeTime: 20
          delta: 3
          motorPosition: 540
    output:
      bytes: [6, 1, 4, 28, 35]
      fPort: 1
