services:
  prod:
    build:
      context: .
      dockerfile: Dockerfile
    image: opengtb:latest
    container_name: opengtb-prod
    ports:
      - "127.0.0.1:7880:7880"   # local uniquement, l'accès public passe par le tunnel
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      - counter
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7880/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  counter:
    build:
      context: ./counter
    image: opengtb-counter:latest
    container_name: opengtb-counter
    volumes:
      - counter_data:/data
    restart: unless-stopped
    mem_limit: 128m

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: opengtb-tunnel
    profiles: ["tunnel"]        # lancé seulement si COMPOSE_PROFILES=tunnel (VPS)
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      prod:
        condition: service_healthy

  dev:
    image: node:24-alpine
    container_name: opengtb-dev
    working_dir: /app
    volumes:
      - .:/app
      - opengtb_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    profiles: ["dev"]

volumes:
  opengtb_node_modules:
  counter_data:
