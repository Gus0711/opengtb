services:
  prod:
    build:
      context: .
      dockerfile: Dockerfile
    image: opengtb:latest
    container_name: opengtb-prod
    ports:
      - "127.0.0.1:7880:7880"   # local uniquement, l'accès public passe par le tunnel
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7880/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  api:
    build:
      context: ./api
    image: opengtb-api:latest
    container_name: opengtb-api
    volumes:
      - counter_data:/data      # nom conservé pour garder le compteur existant
    environment:
      - ADMIN_TOKEN=${MESSAGES_ADMIN_TOKEN:-}
      - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY:-}
      - TURNSTILE_SECRET=${TURNSTILE_SECRET:-}
      - NTFY_URL=${NTFY_URL:-}
    restart: unless-stopped
    mem_limit: 128m

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: opengtb-tunnel
    profiles: ["tunnel"]        # lancé seulement si COMPOSE_PROFILES=tunnel (VPS)
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      prod:
        condition: service_healthy

  dev:
    image: node:24-alpine
    container_name: opengtb-dev
    working_dir: /app
    volumes:
      - .:/app
      - opengtb_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    profiles: ["dev"]

volumes:
  opengtb_node_modules:
  counter_data:
