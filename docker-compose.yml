services:
  prod:
    build:
      context: .
      dockerfile: Dockerfile
    image: opengtb:latest
    container_name: opengtb-prod
    ports:
      - "7880:7880"
    restart: unless-stopped
    depends_on:
      - counter
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7880/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  counter:
    build:
      context: ./counter
    image: opengtb-counter:latest
    container_name: opengtb-counter
    volumes:
      - counter_data:/data
    restart: unless-stopped

  dev:
    image: node:24-alpine
    container_name: opengtb-dev
    working_dir: /app
    volumes:
      - .:/app
      - opengtb_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    profiles: ["dev"]

volumes:
  opengtb_node_modules:
  counter_data:
