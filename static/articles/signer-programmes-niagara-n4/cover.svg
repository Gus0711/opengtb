<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice">
	<rect width="600" height="400" fill="#07090a" />

	<g stroke="#11161a" stroke-width="1" opacity="0.7">
		<line x1="0" y1="100" x2="600" y2="100" />
		<line x1="0" y1="200" x2="600" y2="200" />
		<line x1="0" y1="300" x2="600" y2="300" />
	</g>

	<text
		x="35"
		y="65"
		font-family="JetBrains Mono, ui-monospace, monospace"
		font-size="20"
		font-weight="700"
		fill="#6ce26c"
	>$ niagara compile Program</text>

	<!-- avant : erreur -->
	<circle cx="42" cy="106" r="6" fill="#e0853a" />
	<text
		x="58"
		y="111"
		font-family="JetBrains Mono, ui-monospace, monospace"
		font-size="15"
		fill="#e0a06a"
	>Program is not signed</text>

	<!-- étapes de résolution -->
	<text x="35" y="150" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#b3bfc8">✓ certificate usage : Code Signing</text>
	<text x="35" y="176" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#b3bfc8">✓ export (sans clé privée)</text>
	<text x="35" y="226" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#b3bfc8">✓ user trust store : accepté</text>

	<!-- après : succès -->
	<circle cx="42" cy="266" r="6" fill="#6ce26c" />
	<text
		x="58"
		y="271"
		font-family="JetBrains Mono, ui-monospace, monospace"
		font-size="15"
		font-weight="700"
		fill="#6ce26c"
	>Program is up-to-date</text>

	<!-- vignette : bouclier + clé (code signing) -->
	<g transform="translate(395 270)" opacity="0.95">
		<rect x="0" y="0" width="170" height="90" fill="#0d1113" stroke="#1a2024" stroke-width="1" />
		<g transform="translate(34 18)">
			<!-- bouclier -->
			<path
				d="M26 2 L46 9 V26 C46 40 37 49 26 53 C15 49 6 40 6 26 V9 Z"
				fill="none"
				stroke="#6ce26c"
				stroke-width="2.2"
				stroke-linejoin="round"
			/>
			<!-- check intérieur -->
			<path
				d="M17 27 L24 34 L37 18"
				fill="none"
				stroke="#6ce26c"
				stroke-width="2.6"
				stroke-linecap="round"
				stroke-linejoin="round"
			/>
		</g>
	</g>

	<text
		x="35"
		y="375"
		font-family="JetBrains Mono, ui-monospace, monospace"
		font-size="11"
		fill="#6a7682"
	>// niagara n4 · code signing · jace 8000</text>
</svg>
