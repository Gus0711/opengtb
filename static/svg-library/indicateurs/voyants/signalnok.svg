<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Fond cercle rouge foncé -->
  <circle cx="50" cy="50" r="48" fill="#c0392b"/>

  <!-- Pulsation cercle rouge -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="#ff2222" stroke-width="2" opacity="0">
    <animate attributeName="r" values="48;56;48" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0;0.7" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Barres de signal grises (fond statique) -->
  <rect x="15" y="68" width="10" height="14" rx="2" fill="#ffffff" opacity="0.15"/>
  <rect x="28" y="60" width="10" height="22" rx="2" fill="#ffffff" opacity="0.15"/>
  <rect x="41" y="52" width="10" height="30" rx="2" fill="#ffffff" opacity="0.15"/>
  <rect x="54" y="42" width="10" height="40" rx="2" fill="#ffffff" opacity="0.15"/>
  <rect x="67" y="30" width="10" height="52" rx="2" fill="#ffffff" opacity="0.15"/>

  <!-- Barres qui disparaissent une par une (de droite à gauche) -->
  <!-- Barre 5 - disparait en premier -->
  <rect x="67" y="30" width="10" height="52" rx="2" fill="#ff4444">
    <animate attributeName="opacity" values="0.9;0.9;0;0;0.9" dur="2.5s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="height" values="52;52;0;0;52" dur="2.5s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="y" values="30;30;82;82;30" dur="2.5s" begin="0s" repeatCount="indefinite"/>
  </rect>

  <!-- Barre 4 -->
  <rect x="54" y="42" width="10" height="40" rx="2" fill="#ff4444">
    <animate attributeName="opacity" values="0.9;0.9;0;0;0.9" dur="2.5s" begin="0.2s" repeatCount="indefinite"/>
    <animate attributeName="height" values="40;40;0;0;40" dur="2.5s" begin="0.2s" repeatCount="indefinite"/>
    <animate attributeName="y" values="42;42;82;82;42" dur="2.5s" begin="0.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Barre 3 -->
  <rect x="41" y="52" width="10" height="30" rx="2" fill="#ff4444">
    <animate attributeName="opacity" values="0.9;0.9;0;0;0.9" dur="2.5s" begin="0.4s" repeatCount="indefinite"/>
    <animate attributeName="height" values="30;30;0;0;30" dur="2.5s" begin="0.4s" repeatCount="indefinite"/>
    <animate attributeName="y" values="52;52;82;82;52" dur="2.5s" begin="0.4s" repeatCount="indefinite"/>
  </rect>

  <!-- Barre 2 -->
  <rect x="28" y="60" width="10" height="22" rx="2" fill="#ff4444">
    <animate attributeName="opacity" values="0.9;0.9;0;0;0.9" dur="2.5s" begin="0.6s" repeatCount="indefinite"/>
    <animate attributeName="height" values="22;22;0;0;22" dur="2.5s" begin="0.6s" repeatCount="indefinite"/>
    <animate attributeName="y" values="60;60;82;82;60" dur="2.5s" begin="0.6s" repeatCount="indefinite"/>
  </rect>

  <!-- Barre 1 - disparait en dernier -->
  <rect x="15" y="68" width="10" height="14" rx="2" fill="#ff4444">
    <animate attributeName="opacity" values="0.9;0.9;0;0;0.9" dur="2.5s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="height" values="14;14;0;0;14" dur="2.5s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="y" values="68;68;82;82;68" dur="2.5s" begin="0.8s" repeatCount="indefinite"/>
  </rect>

  <!-- Badge croix NOK -->
  <circle cx="75" cy="78" r="12" fill="#7b0e0e">
    <animate attributeName="opacity" values="0;0;1;1;0" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <line x1="69" y1="72" x2="81" y2="84" stroke="#ff4444" stroke-width="3" stroke-linecap="round"
    stroke-dasharray="18" stroke-dashoffset="18">
    <animate attributeName="stroke-dashoffset" values="18;18;0;0;18" dur="2.5s" repeatCount="indefinite"/>
  </line>
  <line x1="81" y1="72" x2="69" y2="84" stroke="#ff4444" stroke-width="3" stroke-linecap="round"
    stroke-dasharray="18" stroke-dashoffset="18">
    <animate attributeName="stroke-dashoffset" values="18;18;0;0;18" dur="2.5s" begin="0.2s" repeatCount="indefinite"/>
  </line>
</svg>