<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Fond cercle teal -->
  <circle cx="50" cy="50" r="48" fill="#2a9d8f"/>
  
  <!-- Pulsation cercle -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="#00ff44" stroke-width="2" opacity="0">
    <animate attributeName="r" values="48;56;48" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Barre 1 -->
  <rect x="15" width="10" rx="2" fill="#00ff44">
    <animate attributeName="y" values="82;68;82" dur="2.5s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="height" values="0;14;0" dur="2.5s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" dur="2.5s" begin="0s" repeatCount="indefinite"/>
  </rect>

  <!-- Barre 2 -->
  <rect x="28" width="10" rx="2" fill="#00ff44">
    <animate attributeName="y" values="82;60;82" dur="2.5s" begin="0.2s" repeatCount="indefinite"/>
    <animate attributeName="height" values="0;22;0" dur="2.5s" begin="0.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" dur="2.5s" begin="0.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Barre 3 -->
  <rect x="41" width="10" rx="2" fill="#00ff44">
    <animate attributeName="y" values="82;52;82" dur="2.5s" begin="0.4s" repeatCount="indefinite"/>
    <animate attributeName="height" values="0;30;0" dur="2.5s" begin="0.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" dur="2.5s" begin="0.4s" repeatCount="indefinite"/>
  </rect>

  <!-- Barre 4 -->
  <rect x="54" width="10" rx="2" fill="#00ff44">
    <animate attributeName="y" values="82;42;82" dur="2.5s" begin="0.6s" repeatCount="indefinite"/>
    <animate attributeName="height" values="0;40;0" dur="2.5s" begin="0.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" dur="2.5s" begin="0.6s" repeatCount="indefinite"/>
  </rect>

  <!-- Barre 5 -->
  <rect x="67" width="10" rx="2" fill="#00ff44">
    <animate attributeName="y" values="82;30;82" dur="2.5s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="height" values="0;52;0" dur="2.5s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" dur="2.5s" begin="0.8s" repeatCount="indefinite"/>
  </rect>

  <!-- Badge checkmark -->
  <circle cx="75" cy="78" r="12" fill="#1a7a6e">
    <animate attributeName="opacity" values="0;0;1;1;0" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <polyline points="68,78 73,84 82,72" stroke="#00ff44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"
    stroke-dasharray="30" stroke-dashoffset="30">
    <animate attributeName="stroke-dashoffset" values="30;30;0;0;30" dur="2.5s" repeatCount="indefinite"/>
  </polyline>
</svg>