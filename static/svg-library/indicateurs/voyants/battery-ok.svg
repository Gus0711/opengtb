<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Fond cercle teal -->
  <circle cx="50" cy="50" r="48" fill="#2a9d8f"/>

  <!-- Pulsation cercle -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="#00ff44" stroke-width="2" opacity="0">
    <animate attributeName="r" values="48;56;48" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Contour batterie -->
  <rect x="18" y="32" width="58" height="36" rx="5" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.9"/>
  <!-- Borne + batterie -->
  <rect x="76" y="42" width="8" height="16" rx="3" fill="#ffffff" opacity="0.9"/>

  <!-- Barres internes (3 barres qui se remplissent de gauche à droite) -->
  <!-- Barre 1 -->
  <rect x="24" y="38" width="14" height="24" rx="3" fill="#00ff44">
    <animate attributeName="opacity" values="0;0.9;0.9;0.9;0" dur="2.5s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="width" values="0;14;14;14;0" dur="2.5s" begin="0s" repeatCount="indefinite"/>
  </rect>

  <!-- Barre 2 -->
  <rect x="42" y="38" width="14" height="24" rx="3" fill="#00ff44">
    <animate attributeName="opacity" values="0;0;0.9;0.9;0" dur="2.5s" begin="0.3s" repeatCount="indefinite"/>
    <animate attributeName="width" values="0;0;14;14;0" dur="2.5s" begin="0.3s" repeatCount="indefinite"/>
  </rect>

  <!-- Barre 3 -->
  <rect x="60" y="38" width="14" height="24" rx="3" fill="#00ff44">
    <animate attributeName="opacity" values="0;0;0;0.9;0" dur="2.5s" begin="0.6s" repeatCount="indefinite"/>
    <animate attributeName="width" values="0;0;0;14;0" dur="2.5s" begin="0.6s" repeatCount="indefinite"/>
  </rect>

  <!-- Badge checkmark -->
  <circle cx="75" cy="78" r="12" fill="#1a7a6e">
    <animate attributeName="opacity" values="0;0;0;1;0" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <polyline points="68,78 73,84 82,72" stroke="#00ff44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"
    stroke-dasharray="30" stroke-dashoffset="30">
    <animate attributeName="stroke-dashoffset" values="30;30;30;0;30" dur="2.5s" repeatCount="indefinite"/>
  </polyline>
</svg>