<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <filter id="clock-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    
    <radialGradient id="dial-grad" cx="50%" cy="45%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="85%" style="stop-color:#f1f5f9"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </radialGradient>
    
    <linearGradient id="bezel-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#94a3b8"/>
      <stop offset="50%" style="stop-color:#64748b"/>
      <stop offset="100%" style="stop-color:#475569"/>
    </linearGradient>
    
    <radialGradient id="glass-reflect" cx="40%" cy="35%" r="45%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>
    
    <radialGradient id="center-glow">
      <stop offset="0%" style="stop-color:#334155"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </radialGradient>
  </defs>
  
  <!-- Boîtier -->
  <circle cx="100" cy="100" r="95" fill="url(#bezel-grad)" filter="url(#clock-shadow)"/>
  <circle cx="100" cy="100" r="88" fill="url(#dial-grad)"/>
  
  <!-- Marqueurs heures -->
  <rect x="98" y="18" width="4" height="16" rx="2" fill="#1e293b"/>
  <rect x="98" y="18" width="4" height="12" rx="2" fill="#475569" transform="rotate(30 100 100)"/>
  <rect x="98" y="18" width="4" height="12" rx="2" fill="#475569" transform="rotate(60 100 100)"/>
  <rect x="98" y="18" width="4" height="16" rx="2" fill="#1e293b" transform="rotate(90 100 100)"/>
  <rect x="98" y="18" width="4" height="12" rx="2" fill="#475569" transform="rotate(120 100 100)"/>
  <rect x="98" y="18" width="4" height="12" rx="2" fill="#475569" transform="rotate(150 100 100)"/>
  <rect x="98" y="18" width="4" height="16" rx="2" fill="#1e293b" transform="rotate(180 100 100)"/>
  <rect x="98" y="18" width="4" height="12" rx="2" fill="#475569" transform="rotate(210 100 100)"/>
  <rect x="98" y="18" width="4" height="12" rx="2" fill="#475569" transform="rotate(240 100 100)"/>
  <rect x="98" y="18" width="4" height="16" rx="2" fill="#1e293b" transform="rotate(270 100 100)"/>
  <rect x="98" y="18" width="4" height="12" rx="2" fill="#475569" transform="rotate(300 100 100)"/>
  <rect x="98" y="18" width="4" height="12" rx="2" fill="#475569" transform="rotate(330 100 100)"/>
  
  <!-- Marqueurs minutes -->
  <g fill="#94a3b8">
    <rect x="99.5" y="16" width="1" height="6" rx="0.5" transform="rotate(6 100 100)"/>
    <rect x="99.5" y="16" width="1" height="6" rx="0.5" transform="rotate(12 100 100)"/>
    <rect x="99.5" y="16" width="1" height="6" rx="0.5" transform="rotate(18 100 100)"/>
    <rect x="99.5" y="16" width="1" height="6" rx="0.5" transform="rotate(24 100 100)"/>
    <rect x="99.5" y="16" width="1" height="6" rx="0.5" transform="rotate(36 100 100)"/>
    <rect x="99.5" y="16" width="1" height="6" rx="0.5" transform="rotate(42 100 100)"/>
    <rect x="99.5" y="16" width="1" height="6" rx="0.5" transform="rotate(48 100 100)"/>
