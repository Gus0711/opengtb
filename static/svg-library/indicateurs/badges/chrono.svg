    <rect x="99.5" y="16" width="1" height="6" rx="0.5" transform="rotate(72 100 100)"/>
    <rect x="99.5" y="16" width="1" height="6" rx="0.5" transform="rotate(78 100 100)"/>
    <rect x="99.5" y="16" width="1" height="6" rx="0.5" transform="rotate(84 100 100)"/>
    <rect x="99.5" y="16" width="1" height="6" rx="0.5" transform="rotate(96 100 100)"/>
    <rect x="99.5" y="16" width="1" height="6" rx="0.5" transform="rotate(102 100 100)"/>
    <rect x="99.5" y="16" width="1" height="6" rx="0.5" transform="rotate(108 100 100)"/>
    <rect x="99.5" y="16" width="1" height="6" rx="0.5" transform="rotate(114 100 100)"/>
    <rect x="99.5" y="16" width="1" height="6" rx="0.5" transform="rotate(126 100 100)"/>
    <rect x="99.5" y="16" width="1" height="6" rx="0.5" transform="rotate(132 100 100)"/>
    <rect x="99.5" y="16" width="1" height="6" rx="0.5" transform="rotate(138 100 100)"/>
    <rect x="99.5" y="16" width="1" height="6" rx="0.5" transform="rotate(144 100 100)"/>
    <rect x="99.5" y="16" width="1" height="6" rx="0.5" transform="rotate(156 100 100)"/>
    <rect x="99.5" y="16" width="1" height="6" rx="0.5" transform="rotate(162 100 100)"/>
    <rect x="99.5" y="16" width="1" height="6" rx="0.5" transform="rotate(168 100 100)"/>
    <rect x="99.5" y="16" width="1" height="6" rx="0.5" transform="rotate(174 100 100)"/>
    <rect x="99.5" y="16" width="1" height="6" rx="0.5" transform="rotate(186 100 100)"/>
    <rect x="99.5" y="16" width="1" height="6" rx="0.5" transform="rotate(192 100 100)"/>
    <rect x="99.5" y="16" width="1" height="6" rx="0.5" transform="rotate(198 100 100)"/>
    <rect x="99.5" y="16" width="1" height="6" rx="0.5" transform="rotate(204 100 100)"/>
    <rect x="99.5" y="16" width="1" height="6" rx="0.5" transform="rotate(216 100 100)"/>
    <rect x="99.5" y="16" width="1" height="6" rx="0.5" transform="rotate(222 100 100)"/>
    <rect x="99.5" y="16" width="1" height="6" rx="0.5" transform="rotate(228 100 100)"/>
    <rect x="99.5" y="16" width="1" height="6" rx="0.5" transform="rotate(234 100 100)"/>
    <rect x="99.5" y="16" width="1" height="6" rx="0.5" transform="rotate(246 100 100)"/>
    <rect x="99.5" y="16" width="1" height="6" rx="0.5" transform="rotate(252 100 100)"/>
    <rect x="99.5" y="16" width="1" height="6" rx="0.5" transform="rotate(258 100 100)"/>
    <rect x="99.5" y="16" width="1" height="6" rx="0.5" transform="rotate(264 100 100)"/>
    <rect x="99.5" y="16" width="1" height="6" rx="0.5" transform="rotate(276 100 100)"/>
    <rect x="99.5" y="16" width="1" height="6" rx="0.5" transform="rotate(282 100 100)"/>
    <rect x="99.5" y="16" width="1" height="6" rx="0.5" transform="rotate(288 100 100)"/>
    <rect x="99.5" y="16" width="1" height="6" rx="0.5" transform="rotate(294 100 100)"/>
    <rect x="99.5" y="16" width="1" height="6" rx="0.5" transform="rotate(306 100 100)"/>
    <rect x="99.5" y="16" width="1" height="6" rx="0.5" transform="rotate(312 100 100)"/>
    <rect x="99.5" y="16" width="1" height="6" rx="0.5" transform="rotate(318 100 100)"/>
    <rect x="99.5" y="16" width="1" height="6" rx="0.5" transform="rotate(324 100 100)"/>
    <rect x="99.5" y="16" width="1" height="6" rx="0.5" transform="rotate(336 100 100)"/>
    <rect x="99.5" y="16" width="1" height="6" rx="0.5" transform="rotate(342 100 100)"/>
    <rect x="99.5" y="16" width="1" height="6" rx="0.5" transform="rotate(348 100 100)"/>
    <rect x="99.5" y="16" width="1" height="6" rx="0.5" transform="rotate(354 100 100)"/>
  </g>

  <!-- Aiguille principale chrono - 1 tour en 4s (rapide et bien visible) -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
                      from="0 100 100" to="360 100 100"
                      dur="4s" repeatCount="indefinite"/>
    <line x1="100" y1="100" x2="100" y2="25" 
          stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="100" cy="118" r="3.5" fill="#dc2626"/>
    <line x1="100" y1="100" x2="100" y2="118" 
          stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Aiguille secondaire - 1 tour en 24s -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
                      from="0 100 100" to="360 100 100"
                      dur="24s" repeatCount="indefinite"/>
    <line x1="100" y1="100" x2="100" y2="40" 
          stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
    <line x1="100" y1="100" x2="100" y2="112" 
          stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  
  <!-- Aiguille lente - 1 tour en 120s -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
                      from="0 100 100" to="360 100 100"
                      dur="120s" repeatCount="indefinite"/>
    <line x1="100" y1="100" x2="100" y2="50" 
          stroke="#334155" stroke-width="5.5" stroke-linecap="round"/>
    <line x1="100" y1="100" x2="100" y2="110" 
          stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Centre -->
  <circle cx="100" cy="100" r="7" fill="url(#center-glow)"/>
  <circle cx="100" cy="100" r="3.5" fill="#dc2626"/>
  
  <!-- Reflet verre -->
  <circle cx="100" cy="100" r="86" fill="url(#glass-reflect)" opacity="0.6"/>
</svg>