<svg xmlns="http://www.w3.org/2000/svg" width="140" height="60" viewBox="0 0 140 60">
  <defs>
    <!-- Dégradé vert intense animé -->
    <linearGradient id="bg-fon-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#15803d;stop-opacity:1">
        <animate attributeName="stop-color" 
                 values="#15803d;#16a34a;#22c55e;#16a34a;#15803d" 
                 dur="1.8s" 
                 repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#22c55e;stop-opacity:1">
        <animate attributeName="stop-color" 
                 values="#22c55e;#4ade80;#15803d;#4ade80;#22c55e" 
                 dur="1.8s" 
                 repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#15803d;stop-opacity:1">
        <animate attributeName="stop-color" 
                 values="#15803d;#22c55e;#16a34a;#22c55e;#15803d" 
                 dur="1.8s" 
                 repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <linearGradient id="overlay-fon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15">
        <animate attributeName="stop-opacity" 
                 values="0.15;0.3;0.05;0.25;0.15" 
                 dur="1.2s" 
                 repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.15">
        <animate attributeName="stop-opacity" 
                 values="0.15;0.05;0.25;0.1;0.15" 
                 dur="1.2s" 
                 repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <linearGradient id="knob-grad-3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="50%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
    
    <radialGradient id="knob-hl-3">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>
    
    <filter id="shadow-3" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    
    <filter id="glow-green-f">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fond -->
  <rect x="2" y="2" width="136" height="56" rx="28" fill="url(#bg-fon-green)" stroke="#14532d" stroke-width="1.5"/>
  <rect x="2" y="2" width="136" height="56" rx="28" fill="url(#overlay-fon)" stroke="none"/>
  
  <!-- Pulse border vert -->
  <rect x="2" y="2" width="136" height="56" rx="28" fill="none" stroke="#4ade80" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.1;0.7;0.1" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="1;3;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Texte ON -->
  <text x="45" y="38" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="3" style="text-shadow: 0 2px 6px rgba(0,0,0,0.5);">
    ON
    <animate attributeName="opacity" values="0.8;1;0.8" dur="1.2s" repeatCount="indefinite"/>
  </text>
  
  <!-- Bouton circulaire droite -->
  <g transform="translate(82, 4)" filter="url(#shadow-3)">
    <circle cx="26" cy="26" r="26" fill="url(#knob-grad-3)" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="26" cy="26" r="26" fill="url(#knob-hl-3)"/>
    <ellipse cx="20" cy="18" rx="10" ry="8" fill="white" opacity="0.3"/>
    
    <g fill="none" stroke="#15803d" stroke-width="3" stroke-linecap="round">
      <path d="M26 14 V24"/>
      <path d="M20 18 A 9 9 0 1 0 32 18"/>
    </g>
  </g>
  
  <!-- LED pulsante verte -->
  <circle cx="15" cy="30" r="4" fill="#22c55e" filter="url(#glow-green-f)">
    <animate attributeName="r" values="3;5;3" dur="0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="0.8s" repeatCount="indefinite"/>
  </circle>
</svg>