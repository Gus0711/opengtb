<svg xmlns="http://www.w3.org/2000/svg" width="220" height="60" viewBox="0 0 220 60">
  <defs>
    <!-- Dégradé gris neutre -->
    <linearGradient id="bg-forcage-off" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#374151;stop-opacity:1">
        <animate attributeName="stop-color" 
                 values="#374151;#4b5563;#374151" 
                 dur="4s" 
                 repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#4b5563;stop-opacity:1">
        <animate attributeName="stop-color" 
                 values="#4b5563;#374151;#4b5563" 
                 dur="4s" 
                 repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <linearGradient id="overlay-forcage-off" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.1"/>
    </linearGradient>
    
    <linearGradient id="knob-grad-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="50%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
    
    <radialGradient id="knob-hl-2">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>
    
    <filter id="shadow-2" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Fond principal -->
  <rect x="2" y="2" width="216" height="56" rx="28" fill="url(#bg-forcage-off)" stroke="#1f2937" stroke-width="1.5"/>
  
  <!-- Overlay -->
  <rect x="2" y="2" width="216" height="56" rx="28" fill="url(#overlay-forcage-off)" stroke="none"/>
  
  <!-- Texte FORÇAGE -->
  <text x="135" y="38" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#9ca3af" text-anchor="middle" letter-spacing="1.5">
    FORÇAGE
  </text>
  
  <!-- Bouton circulaire côté gauche = désactivé -->
  <g transform="translate(4, 4)" filter="url(#shadow-2)">
    <circle cx="26" cy="26" r="26" fill="url(#knob-grad-2)" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="26" cy="26" r="26" fill="url(#knob-hl-2)"/>
    <ellipse cx="20" cy="18" rx="10" ry="8" fill="white" opacity="0.3"/>
    
    <!-- Icône éclair barré -->
    <g fill="none" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M28 12 L22 27 L28 27 L24 42"/>
      <line x1="18" y1="14" x2="34" y2="40" stroke="#9ca3af" stroke-width="2"/>
    </g>
  </g>
  
  <!-- LED éteinte -->
  <circle cx="205" cy="30" r="3" fill="#6b7280" opacity="0.5"/>
</svg>