<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Fond cercle orange -->
  <circle cx="50" cy="50" r="48" fill="#d47a1a"/>

  <!-- Pulsation -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="#ffa500" stroke-width="2" opacity="0">
    <animate attributeName="r" values="48;56;48" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Barre verticale qui descend -->
  <rect x="46" y="18" width="8" height="0" rx="4" fill="#ffe0a0">
    <animate attributeName="height" values="0;30;30;30;0" dur="2.5s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;1;0" dur="2.5s" begin="0s" repeatCount="indefinite"/>
  </rect>

  <!-- Flèche (chevron bas) qui apparaît -->
  <polyline points="32,46 50,64 68,46" stroke="#ffe0a0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"
    stroke-dasharray="60" stroke-dashoffset="60">
    <animate attributeName="stroke-dashoffset" values="60;0;0;60" dur="2.5s" begin="0.3s" repeatCount="indefinite"/>
  </polyline>

  <!-- Barre du bas (réception) qui s'étale -->
  <rect x="50" y="72" width="0" height="7" rx="3" fill="#ffe0a0">
    <animate attributeName="width" values="0;36;36;0" dur="2.5s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="x" values="50;32;32;50" dur="2.5s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.5s" begin="0.8s" repeatCount="indefinite"/>
  </rect>

</svg>