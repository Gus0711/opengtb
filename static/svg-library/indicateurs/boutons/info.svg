<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Fond cercle bleu -->
  <circle cx="50" cy="50" r="48" fill="#2563a8"/>

  <!-- Pulsation cercle bleue -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="#4db8ff" stroke-width="2" opacity="0">
    <animate attributeName="r" values="48;56;48" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Point du i -->
  <circle cx="50" cy="28" r="6" fill="#4db8ff" opacity="0">
    <animate attributeName="opacity" values="0;1;1;1;0" dur="2.5s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="r" values="0;6;6;6;0" dur="2.5s" begin="0s" repeatCount="indefinite"/>
  </circle>

  <!-- Barre du i qui descend -->
  <rect x="44" y="40" width="12" height="0" rx="4" fill="#4db8ff">
    <animate attributeName="height" values="0;32;32;32;0" dur="2.5s" begin="0.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;1;0" dur="2.5s" begin="0.3s" repeatCount="indefinite"/>
  </rect>

  <!-- Petite base en bas du i -->
  <rect x="36" y="70" width="28" height="5" rx="3" fill="#4db8ff" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" dur="2.5s" begin="0.6s" repeatCount="indefinite"/>
    <animate attributeName="width" values="0;0;28;28;0" dur="2.5s" begin="0.6s" repeatCount="indefinite"/>
    <animate attributeName="x" values="50;50;36;36;50" dur="2.5s" begin="0.6s" repeatCount="indefinite"/>
  </rect>

</svg>