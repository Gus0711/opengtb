<svg xmlns="http://www.w3.org/2000/svg" width="140" height="60" viewBox="0 0 140 60">
  <defs>
    <!-- Dégradé rouge intense animé -->
    <linearGradient id="bg-foff-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#b91c1c;stop-opacity:1">
        <animate attributeName="stop-color" 
                 values="#b91c1c;#dc2626;#ef4444;#dc2626;#b91c1c" 
                 dur="1.8s" 
                 repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#dc2626;stop-opacity:1">
        <animate attributeName="stop-color" 
                 values="#dc2626;#ef4444;#f87171;#ef4444;#dc2626" 
                 dur="1.8s" 
                 repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#b91c1c;stop-opacity:1">
        <animate attributeName="stop-color" 
                 values="#b91c1c;#dc2626;#ef4444;#dc2626;#b91c1c" 
                 dur="1.8s" 
                 repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <linearGradient id="overlay-foff" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15">
        <animate attributeName="stop-opacity" 
                 values="0.15;0.3;0.05;0.25;0.15" 
                 dur="1.2s" 
                 repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.15">
        <animate attributeName="stop-opacity" 
                 values="0.15;0.05;0.25;0.1;0.15" 
                 dur="1.2s" 
                 repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <linearGradient id="knob-grad-4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="50%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
    
    <radialGradient id="knob-hl-4">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>
    
    <filter id="shadow-4" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    
    <filter id="glow-red-f">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fond -->
  <rect x="2" y="2" width="136" height="56" rx="28" fill="url(#bg-foff-red)" stroke="#7f1d1d" stroke-width="1.5"/>
  <rect x="2" y="2" width="136" height="56" rx="28" fill="url(#overlay-foff)" stroke="none"/>
  
  <!-- Pulse border rouge -->
  <rect x="2" y="2" width="136" height="56" rx="28" fill="none" stroke="#f87171" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.1;0.7;0.1" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="1;3;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Texte OFF -->
  <text x="95" y="38" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="2" style="text-shadow: 0 2px 6px rgba(0,0,0,0.5);">
    OFF
    <animate attributeName="opacity" values="0.8;1;0.8" dur="1.2s" repeatCount="indefinite"/>
  </text>
  
  <!-- Bouton circulaire gauche -->
  <g transform="translate(4, 4)" filter="url(#shadow-4)">
    <circle cx="26" cy="26" r="26" fill="url(#knob-grad-4)" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="26" cy="26" r="26" fill="url(#knob-hl-4)"/>
    <ellipse cx="20" cy="18" rx="10" ry="8" fill="white" opacity="0.3"/>
    
    <g fill="none" stroke="#b91c1c" stroke-width="3" stroke-linecap="round">
      <path d="M26 14 V24"/>
      <path d="M20 18 A 9 9 0 1 0 32 18"/>
    </g>
  </g>
  
  <!-- LED pulsante rouge -->
  <circle cx="125" cy="30" r="4" fill="#ef4444" filter="url(#glow-red-f)">
    <animate attributeName="r" values="3;5;3" dur="0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="0.8s" repeatCount="indefinite"/>
  </circle>
</svg>