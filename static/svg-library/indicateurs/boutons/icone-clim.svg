<svg xmlns="http://www.w3.org/2000/svg" width="90" height="90" viewBox="0 0 90 90">
  <defs>
    <!-- Fond bouton - dégradé sombre pro -->
    <linearGradient id="btn-bg-c" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#374151"/>
      <stop offset="100%" style="stop-color:#1f2937"/>
    </linearGradient>
    
    <!-- Contour subtil lumineux -->
    <linearGradient id="btn-stroke-c" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6b7280"/>
      <stop offset="100%" style="stop-color:#374151"/>
    </linearGradient>
    
    <!-- Inner highlight top -->
    <linearGradient id="btn-highlight-c" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.08"/>
      <stop offset="40%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    
    <!-- Dégradé flocon / froid -->
    <linearGradient id="snow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#93c5fd"/>
      <stop offset="50%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    
    <!-- Dégradé chaud (partie basse) -->
    <linearGradient id="warm-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
    
    <!-- Engrenage dégradé -->
    <linearGradient id="gear-fill-c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9ca3af"/>
      <stop offset="100%" style="stop-color:#6b7280"/>
    </linearGradient>
    
    <!-- Glow froid bleu -->
    <filter id="cold-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="g"/>
      <feComposite in="SourceGraphic" in2="g" operator="over"/>
    </filter>
    
    <!-- Glow ambiant bleu sur le bouton -->
    <radialGradient id="ambient-glow-c" cx="50%" cy="40%" r="45%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.1">
        <animate attributeName="stop-opacity" values="0.1;0.18;0.06;0.15;0.1" dur="2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0"/>
    </radialGradient>
    
    <!-- Ombre portée bouton -->
    <filter id="btn-shadow-c" x="-15%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- ===== BOUTON CONTAINER ===== -->
  <rect x="5" y="5" width="80" height="80" rx="18" fill="url(#btn-bg-c)" filter="url(#btn-shadow-c)"/>
  <rect x="5" y="5" width="80" height="80" rx="18" fill="url(#btn-bg-c)"/>
  <rect x="5" y="5" width="80" height="80" rx="18" fill="none" stroke="url(#btn-stroke-c)" stroke-width="1"/>
  <rect x="5" y="5" width="80" height="80" rx="18" fill="url(#btn-highlight-c)"/>
  <rect x="5" y="5" width="80" height="80" rx="18" fill="url(#ambient-glow-c)"/>
  
  <!-- Pulse border subtil bleu -->
  <rect x="5" y="5" width="80" height="80" rx="18" fill="none" stroke="#60a5fa" stroke-width="0.8">
    <animate attributeName="stroke-opacity" values="0;0.3;0" dur="2.5s" repeatCount="indefinite"/>
  </rect>

  <!-- ===== ENGRENAGE - rotation continue ===== -->
  <g opacity="0.25">
    <animateTransform attributeName="transform" type="rotate"
                      from="0 45 48" to="360 45 48"
                      dur="12s" repeatCount="indefinite"/>
    <circle cx="45" cy="48" r="22" fill="none" stroke="url(#gear-fill-c)" stroke-width="6"/>
    <g fill="#9ca3af">
      <rect x="42" y="21" width="6" height="9" rx="2"/>
      <rect x="42" y="66" width="6" height="9" rx="2"/>
      <rect x="18" y="45" width="9" height="6" rx="2"/>
      <rect x="63" y="45" width="9" height="6" rx="2"/>
      <rect x="42" y="21" width="6" height="9" rx="2" transform="rotate(45 45 48)"/>
      <rect x="42" y="66" width="6" height="9" rx="2" transform="rotate(45 45 48)"/>
      <rect x="18" y="45" width="9" height="6" rx="2" transform="rotate(45 45 48)"/>
      <rect x="63" y="45" width="9" height="6" rx="2" transform="rotate(45 45 48)"/>
    </g>
    <circle cx="45" cy="48" r="12" fill="#1f2937"/>
  </g>

  <!-- ===== FLOCON DE NEIGE ANIMÉ (rotation lente + pulse) ===== -->
  <g transform="translate(45, 42)" filter="url(#cold-glow)">
    <!-- Rotation lente du flocon -->
    <animateTransform attributeName="transform" type="rotate"
                      from="0" to="360"
                      dur="20s" repeatCount="indefinite" additive="sum"/>
    
    <!-- Pulse scale -->
    <animateTransform attributeName="transform" type="scale"
                      values="1;1.06;0.97;1.03;1" 
                      dur="2.5s" repeatCount="indefinite" additive="sum"/>
    
    <g stroke="url(#snow-grad)" stroke-width="2.2" stroke-linecap="round" fill="none">
      <!-- Branche verticale -->
      <line x1="0" y1="-16" x2="0" y2="16"/>
      <line x1="-4" y1="-12" x2="0" y2="-16"/><line x1="4" y1="-12" x2="0" y2="-16"/>
      <line x1="-4" y1="12" x2="0" y2="16"/><line x1="4" y1="12" x2="0" y2="16"/>
      <line x1="-3" y1="-7" x2="0" y2="-10"/><line x1="3" y1="-7" x2="0" y2="-10"/>
      <line x1="-3" y1="7" x2="0" y2="10"/><line x1="3" y1="7" x2="0" y2="10"/>
      
      <!-- Branche 60° -->
      <line x1="-13.9" y1="8" x2="13.9" y2="-8"/>
      <line x1="-13.9" y1="8" x2="-12.5" y2="3.6"/><line x1="-13.9" y1="8" x2="-9.5" y2="9.4"/>
      <line x1="13.9" y1="-8" x2="12.5" y2="-3.6"/><line x1="13.9" y1="-8" x2="9.5" y2="-9.4"/>
      <line x1="-7" y1="4" x2="-8.7" y2="0.7"/><line x1="7" y1="-4" x2="8.7" y2="-0.7"/>
      
      <!-- Branche 120° -->
      <line x1="-13.9" y1="-8" x2="13.9" y2="8"/>
      <line x1="-13.9" y1="-8" x2="-9.5" y2="-9.4"/><line x1="-13.9" y1="-8" x2="-12.5" y2="-3.6"/>
      <line x1="13.9" y1="8" x2="9.5" y2="9.4"/><line x1="13.9" y1="8" x2="12.5" y2="3.6"/>
      <line x1="-7" y1="-4" x2="-8.7" y2="-0.7"/><line x1="7" y1="4" x2="8.7" y2="0.7"/>
    </g>
    
    <!-- Centre cristal -->
    <circle cx="0" cy="0" r="3" fill="#93c5fd" opacity="0.6">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2.5;3.5;2.5" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- ===== PARTICULES DE GIVRE flottantes ===== -->
  <circle cx="25" cy="28" r="1.2" fill="#93c5fd" opacity="0">
    <animate attributeName="opacity" values="0;0.7;0" dur="2.5s" repeatCount="indefinite" begin="0s"/>
    <animate attributeName="cy" values="32;24" dur="2.5s" repeatCount="indefinite" begin="0s"/>
  </circle>
  <circle cx="62" cy="30" r="1" fill="#bfdbfe" opacity="0">
    <animate attributeName="opacity" values="0;0.6;0" dur="3s" repeatCount="indefinite" begin="0.8s"/>
    <animate attributeName="cy" values="34;26" dur="3s" repeatCount="indefinite" begin="0.8s"/>
  </circle>
  <circle cx="35" cy="55" r="0.8" fill="#93c5fd" opacity="0">
    <animate attributeName="opacity" values="0;0.5;0" dur="2.8s" repeatCount="indefinite" begin="1.5s"/>
    <animate attributeName="cy" values="58;50" dur="2.8s" repeatCount="indefinite" begin="1.5s"/>
  </circle>
  <circle cx="55" cy="52" r="1.1" fill="#bfdbfe" opacity="0">
    <animate attributeName="opacity" values="0;0.6;0" dur="2.2s" repeatCount="indefinite" begin="0.4s"/>
    <animate attributeName="cy" values="56;48" dur="2.2s" repeatCount="indefinite" begin="0.4s"/>
  </circle>

  <!-- ===== MINI THERMOMÈTRE chaud/froid en bas à droite ===== -->
  <g transform="translate(60, 62)" opacity="0.85">
    <circle cx="8" cy="8" r="10" fill="#111827" stroke="#4b5563" stroke-width="0.8"/>
    <!-- Corps thermomètre -->
    <rect x="6" y="1" width="4" height="11" rx="2" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <!-- Bulbe -->
    <circle cx="8" cy="13" r="2.5" fill="#ea580c">
      <animate attributeName="fill" values="#ea580c;#3b82f6;#ea580c" dur="4s" repeatCount="indefinite"/>
    </circle>
    <!-- Niveau qui monte/descend -->
    <rect x="7" y="4" width="2" rx="1" fill="#ea580c">
      <animate attributeName="fill" values="#ea580c;#3b82f6;#ea580c" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="height" values="8;4;8" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="4;8;4" dur="4s" repeatCount="indefinite"/>
    </rect>
    <!-- Graduations -->
    <line x1="10.5" y1="4" x2="12" y2="4" stroke="#6b7280" stroke-width="0.6"/>
    <line x1="10.5" y1="6.5" x2="11.5" y2="6.5" stroke="#6b7280" stroke-width="0.6"/>
    <line x1="10.5" y1="9" x2="12" y2="9" stroke="#6b7280" stroke-width="0.6"/>
  </g>
</svg>