<svg xmlns="http://www.w3.org/2000/svg" width="220" height="60" viewBox="0 0 220 60">
  <defs>
    <!-- Dégradé vert/teal animé - mode Auto activé -->
    <linearGradient id="bg-auto-on" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#047857;stop-opacity:1">
        <animate attributeName="stop-color" 
                 values="#047857;#059669;#10b981;#0d9488;#047857" 
                 dur="2.5s" 
                 repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#059669;stop-opacity:1">
        <animate attributeName="stop-color" 
                 values="#059669;#10b981;#0d9488;#047857;#059669" 
                 dur="2.5s" 
                 repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1">
        <animate attributeName="stop-color" 
                 values="#10b981;#0d9488;#047857;#059669;#10b981" 
                 dur="2.5s" 
                 repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <!-- Overlay pulsant -->
    <linearGradient id="overlay-auto-on" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.12">
        <animate attributeName="stop-opacity" 
                 values="0.12;0.25;0.05;0.2;0.12" 
                 dur="2s" 
                 repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.12">
        <animate attributeName="stop-opacity" 
                 values="0.12;0.05;0.2;0.08;0.12" 
                 dur="2s" 
                 repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <linearGradient id="knob-grad-auto" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="50%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
    
    <radialGradient id="knob-hl-auto">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>
    
    <filter id="shadow-auto" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    
    <filter id="glow-green">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fond principal animé -->
  <rect x="2" y="2" width="216" height="56" rx="28" fill="url(#bg-auto-on)" stroke="#064e3b" stroke-width="1.5"/>
  
  <!-- Overlay -->
  <rect x="2" y="2" width="216" height="56" rx="28" fill="url(#overlay-auto-on)" stroke="none"/>
  
  <!-- Pulse border -->
  <rect x="2" y="2" width="216" height="56" rx="28" fill="none" stroke="#34d399" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.2;0.7;0.2" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="1;2.5;1" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Texte AUTO -->
  <text x="90" y="38" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="2" style="text-shadow: 0 2px 4px rgba(0,0,0,0.5);">
    AUTO
    <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" repeatCount="indefinite"/>
  </text>
  
  <!-- Bouton circulaire côté droit = activé -->
  <g transform="translate(160, 4)" filter="url(#shadow-auto)">
    <circle cx="26" cy="26" r="26" fill="url(#knob-grad-auto)" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="26" cy="26" r="26" fill="url(#knob-hl-auto)"/>
    <ellipse cx="20" cy="18" rx="10" ry="8" fill="white" opacity="0.3"/>
    
    <!-- Icône engrenage / auto -->
    <g fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <!-- Cercle central -->
      <circle cx="26" cy="26" r="5"/>
      <!-- Dents d'engrenage (6 traits) -->
      <line x1="26" y1="15" x2="26" y2="18"/>
      <line x1="26" y1="34" x2="26" y2="37"/>
      <line x1="16.5" y1="20.5" x2="19" y2="22.2"/>
      <line x1="33" y1="29.8" x2="35.5" y2="31.5"/>
      <line x1="16.5" y1="31.5" x2="19" y2="29.8"/>
      <line x1="33" y1="22.2" x2="35.5" y2="20.5"/>
    </g>
  </g>
  
  <!-- LED pulsante -->
  <circle cx="15" cy="30" r="4" fill="#34d399" filter="url(#glow-green)">
    <animate attributeName="r" values="3;5;3" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.2s" repeatCount="indefinite"/>
  </circle>
</svg>