<svg xmlns="http://www.w3.org/2000/svg" width="220" height="60" viewBox="0 0 220 60">
  <defs>
    <!-- Dégradé orange/ambre animé - forçage activé -->
    <linearGradient id="bg-forcage-on" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#b45309;stop-opacity:1">
        <animate attributeName="stop-color" 
                 values="#b45309;#d97706;#f59e0b;#ea580c;#b45309" 
                 dur="2s" 
                 repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#d97706;stop-opacity:1">
        <animate attributeName="stop-color" 
                 values="#d97706;#f59e0b;#ea580c;#b45309;#d97706" 
                 dur="2s" 
                 repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1">
        <animate attributeName="stop-color" 
                 values="#f59e0b;#ea580c;#b45309;#d97706;#f59e0b" 
                 dur="2s" 
                 repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <!-- Overlay pulsant -->
    <linearGradient id="overlay-forcage-on" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15">
        <animate attributeName="stop-opacity" 
                 values="0.15;0.3;0.05;0.25;0.15" 
                 dur="1.5s" 
                 repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.15">
        <animate attributeName="stop-opacity" 
                 values="0.15;0.05;0.25;0.1;0.15" 
                 dur="1.5s" 
                 repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <linearGradient id="knob-grad-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="50%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
    
    <radialGradient id="knob-hl-1">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>
    
    <filter id="shadow-1" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    
    <filter id="glow-amber">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Pulse ring filter -->
    <filter id="pulse-ring">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fond principal animé -->
  <rect x="2" y="2" width="216" height="56" rx="28" fill="url(#bg-forcage-on)" stroke="#78350f" stroke-width="1.5"/>
  
  <!-- Overlay -->
  <rect x="2" y="2" width="216" height="56" rx="28" fill="url(#overlay-forcage-on)" stroke="none"/>
  
  <!-- Pulse border -->
  <rect x="2" y="2" width="216" height="56" rx="28" fill="none" stroke="#fbbf24" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.2;0.8;0.2" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="1;3;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Texte FORÇAGE -->
  <text x="90" y="38" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1.5" style="text-shadow: 0 2px 4px rgba(0,0,0,0.5);">
    FORÇAGE
    <animate attributeName="opacity" values="0.85;1;0.85" dur="1.5s" repeatCount="indefinite"/>
  </text>
  
  <!-- Bouton circulaire côté droit = activé -->
  <g transform="translate(160, 4)" filter="url(#shadow-1)">
    <circle cx="26" cy="26" r="26" fill="url(#knob-grad-1)" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="26" cy="26" r="26" fill="url(#knob-hl-1)"/>
    <ellipse cx="20" cy="18" rx="10" ry="8" fill="white" opacity="0.3"/>
    
    <!-- Icône éclair / forçage -->
    <g fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M28 12 L22 27 L28 27 L24 42"/>
    </g>
  </g>
  
  <!-- LED pulsante -->
  <circle cx="15" cy="30" r="4" fill="#f59e0b" filter="url(#glow-amber)">
    <animate attributeName="r" values="3;5;3" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1s" repeatCount="indefinite"/>
  </circle>
</svg>